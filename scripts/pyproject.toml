[project]
name = "dashboard-tesouraria"
version = "2.0.0"
description = "Processador de dados financeiros para Dashboard de Tesouraria - Suporta Excel, Google Sheets, PDF, CSV"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "pdfplumber>=0.11.0",
    "gspread>=6.0.0",
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
    "tabula-py>=2.9.0",
    "camelot-py>=0.11.0",
]

[project.scripts]
processar = "processar_dados:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0"
]
